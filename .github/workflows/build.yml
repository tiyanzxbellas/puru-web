name: Build puruweb

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Upload hasil ke release v1.0.0 juga (lewat gh release upload)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64, suffix: linux-amd64 }
          - { goos: linux,  goarch: arm64, suffix: linux-arm64 }
          - { goos: darwin, goarch: amd64, suffix: macos-amd64 }
          - { goos: darwin, goarch: arm64, suffix: macos-arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w" -o "puruweb-${{ matrix.suffix }}" ./cmd/puruweb
          ls -lh "puruweb-${{ matrix.suffix }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: puruweb-${{ matrix.suffix }}
          path: puruweb-${{ matrix.suffix }}
          if-no-files-found: error

      - name: Upload ke release v1.0.0
        if: ${{ github.event.inputs.make_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "puruweb-${{ matrix.suffix }}" --clobber -R "$GITHUB_REPOSITORY"
