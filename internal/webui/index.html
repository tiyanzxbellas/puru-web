<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Puru AI — Web Chat</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#30363d;
  --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent2:#238636;
  --code-bg:#0a0e14; --user-bg:#1f6feb26; --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;
}
.app{display:flex; height:100%; width:100%}

/* ================= sidebar ================= */
#sidebar{
  width:264px; flex:0 0 264px; background:var(--panel);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0; z-index:40;
}
.sb-head{
  display:flex; align-items:center; gap:9px;
  padding:12px 14px; border-bottom:1px solid var(--border);
}
.sb-head .logo{font-size:22px; line-height:1}
.sb-head h1{font-size:14px; margin:0; font-weight:650; letter-spacing:.2px}
.sb-head .sub{font-size:10.5px; color:var(--muted)}
.sb-new{
  margin:12px 12px 4px; padding:10px 12px; border-radius:10px;
  border:1px dashed var(--border); background:transparent; color:var(--fg);
  font:600 13px/1 inherit; cursor:pointer; display:flex; gap:8px;
  align-items:center; justify-content:center; transition:.15s;
}
.sb-new:hover{border-color:var(--accent); color:var(--accent); background:#58a6ff12}
.sb-label{
  font-size:10.5px; letter-spacing:.8px; text-transform:uppercase;
  color:var(--muted); padding:12px 16px 4px;
}
.sb-list{flex:1; overflow-y:auto; padding:4px 8px 14px; display:flex; flex-direction:column; gap:3px}
.sb-item{
  display:flex; flex-direction:column; gap:2px; text-align:left;
  background:transparent; border:1px solid transparent; border-radius:9px;
  padding:8px 10px; color:var(--fg); cursor:pointer; font:inherit; width:100%;
  transition:.12s;
}
.sb-item:hover{background:var(--panel2)}
.sb-item.active{background:#1f6feb26; border-color:#1f6feb55}
.sb-item .sb-t{font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sb-item .sb-m{font-size:10.5px; color:var(--muted)}
.sb-empty{color:var(--muted); font-size:12px; padding:8px 12px}
.sb-foot{
  border-top:1px solid var(--border); padding:10px 14px;
  font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px;
}
.sb-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block}
.sb-foot.off .dot{background:#d29922}

/* ================= chat column ================= */
.chat{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0}
.chat header{
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; background:var(--panel);
  border-bottom:1px solid var(--border);
}
.chat header .title{font-size:14px; font-weight:650; letter-spacing:.2px}
.chat header .title small{color:var(--muted); font-weight:400; font-size:11px; display:block}
.chat header .spacer{flex:1}
.hbtn{
  background:var(--panel2); color:var(--fg); border:1px solid var(--border);
  border-radius:8px; padding:6px 11px; font-size:12px; cursor:pointer; transition:.15s;
  display:inline-flex; align-items:center; gap:6px;
}
.hbtn:hover{border-color:var(--accent); color:var(--accent)}
#btn-menu{display:none}

main{flex:1; overflow-y:auto; padding:18px 12px 8px; scroll-behavior:smooth}
.wrap{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:14px}

/* ---- messages: bubble normal, tanpa label KAMU/PURU ---- */
.msg{display:flex; gap:10px; animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .who{
  width:30px;height:30px;border-radius:9px;flex:0 0 30px;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--panel2); border:1px solid var(--border);
}
.msg.user{justify-content:flex-end}
.msg.user .who{display:none}
.body{min-width:0; flex:1; position:relative}
.msg .body{max-width:min(88%,720px)}
.msg.user .body{
  background:var(--user-bg); border:1px solid #1f6feb44;
  padding:9px 13px; border-radius:14px 14px 5px 14px; flex:0 1 auto;
}
.msg.assistant .body{
  background:var(--panel); border:1px solid var(--border);
  padding:10px 14px; border-radius:14px 14px 14px 5px;
}
.content{word-wrap:break-word; overflow-wrap:anywhere; -webkit-user-select:text; user-select:text}
/* markdown */
.content p{margin:.35em 0}
.content p:first-child{margin-top:0} .content p:last-child{margin-bottom:0}
.content h1,.content h2,.content h3{margin:.6em 0 .3em; line-height:1.3}
.content h1{font-size:1.35em} .content h2{font-size:1.2em} .content h3{font-size:1.05em}
.content ul,.content ol{margin:.3em 0; padding-left:1.4em}
.content li{margin:.15em 0}
.content a{color:var(--accent)}
.content hr{border:none;border-top:1px solid var(--border);margin:.7em 0}
.content blockquote{
  margin:.4em 0; padding:2px 12px; border-left:3px solid var(--accent);
  color:var(--muted); background:#58a6ff0d; border-radius:0 8px 8px 0;
}
.content table{border-collapse:collapse; margin:.4em 0; font-size:14px}
.content th,.content td{border:1px solid var(--border); padding:5px 10px}
.content th{background:var(--panel2)}
.content strong{color:#fff}
.content em{color:#d2ddf0}
.content code.ic{
  background:#6e768133; padding:1.5px 6px; border-radius:6px;
  font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:#ffab70; border:1px solid #6e768126;
}
/* ---- code block: tombol salin DI ATAS kode ---- */
.codeblock{
  margin:.6em 0; border:1px solid var(--border); border-radius:10px;
  overflow:hidden; background:var(--code-bg);
}
.cb-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:6px 10px; background:var(--panel2);
  border-bottom:1px solid var(--border);
  font-size:11.5px; color:var(--muted);
}
.cb-head .lang{text-transform:uppercase; letter-spacing:.8px; font-weight:600; color:var(--accent)}
.copy-btn{
  background:#238636; color:#fff; border:none; border-radius:7px;
  padding:4px 12px; font-size:12px; font-weight:600; cursor:pointer;
  transition:.15s; display:inline-flex; align-items:center; gap:5px;
}
.copy-btn:hover{background:#2ea043}
.copy-btn.done{background:#1a7f37}
.codeblock pre{
  margin:0; padding:12px 14px; overflow-x:auto;
  font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:#c9d1d9; tab-size:2;
}
.codeblock pre::-webkit-scrollbar{height:8px}
.codeblock pre::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
/* ---- ketuk bubble → tombol salin muncul ---- */
.bubble-actions{display:none; gap:8px; margin-top:8px}
.msg .body.show-actions .bubble-actions{display:flex}
.msg.user .bubble-actions{justify-content:flex-end}
.act-btn{
  background:var(--panel2); color:var(--muted); border:1px solid var(--border);
  border-radius:8px; padding:4px 11px; font-size:12px; cursor:pointer;
  transition:.15s; display:inline-flex; align-items:center; gap:5px;
}
.act-btn:hover{color:var(--fg); border-color:var(--accent)}
.act-btn.done{color:#3fb950; border-color:#238636}
/* ---- typing ---- */
.typing{display:flex; gap:5px; align-items:center; padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
/* ---- welcome ---- */
.welcome{text-align:center; padding:44px 16px 20px; color:var(--muted)}
.welcome .big{font-size:44px; margin-bottom:6px}
.welcome h2{color:var(--fg); margin:0 0 6px; font-size:21px}
.welcome p{margin:0 0 18px; font-size:13.5px}
.chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.chip{
  background:var(--panel); border:1px solid var(--border); color:var(--fg);
  padding:7px 13px; border-radius:999px; font-size:12.5px; cursor:pointer; transition:.15s;
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
/* ---- lampiran & file ---- */
.attachbar{max-width:820px; margin:0 auto 6px; display:none; gap:6px; flex-wrap:wrap}
.attachbar.on{display:flex}
.attach-chip{
  display:inline-flex; align-items:center; gap:7px; max-width:100%;
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:5px 7px 5px 10px; font-size:12px; color:var(--fg);
}
.attach-chip .nm{max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.attach-chip .sz{color:var(--muted); font-size:11px}
.attach-chip .rm{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
.attach-chip .rm:hover{color:#f85149}
#btn-attach{
  background:var(--panel2); color:var(--fg); border:1px solid var(--border);
  border-radius:11px; width:38px;height:38px;flex:0 0 38px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
#btn-attach:hover{border-color:var(--accent); color:var(--accent)}
.msg-files{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.fchip{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
  background:#1f6feb1f; border:1px solid #1f6feb55; color:var(--fg);
  border-radius:10px; padding:6px 10px; font-size:12.5px; transition:.15s; max-width:100%;
}
.fchip:hover{border-color:var(--accent); color:var(--accent)}
.fchip .nm{max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fchip .sz{color:var(--muted); font-size:11px}
#filesPanel{position:fixed; inset:0; background:#000a; z-index:60; display:none}
#filesPanel.show{display:flex; align-items:center; justify-content:center; padding:16px}
.fp-card{
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  width:100%; max-width:540px; max-height:80vh; display:flex; flex-direction:column; overflow:hidden;
}
.fp-head{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border)}
.fp-head h3{margin:0; font-size:14px; flex:1}
.fp-body{overflow-y:auto; padding:8px 10px 14px}
.fp-row{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px}
.fp-row:hover{background:var(--panel2)}
.fp-row .ic{font-size:15px}
.fp-row .meta{flex:1; min-width:0}
.fp-row .n{font-size:13px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fp-row .d{font-size:11px; color:var(--muted)}
.fp-row a{background:var(--accent2); color:#fff; text-decoration:none; border-radius:8px;
  padding:5px 10px; font-size:12px; font-weight:600; white-space:nowrap}
.fp-row a:hover{background:#2ea043}
.fp-row .acts{display:flex; gap:6px}
.fp-thumb{width:44px; height:44px; object-fit:cover; border-radius:8px; flex:0 0 44px; background:#000}
.fmedia{max-width:100%; max-height:300px; border-radius:10px; display:block; background:#000; cursor:pointer; margin-bottom:2px}
.fp-empty{color:var(--muted); font-size:12.5px; padding:14px 12px; line-height:1.6}
@media(max-width:520px){.hide-sm{display:none}}
/* ---- composer ---- */
footer{
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent, var(--bg) 30%);
}
.composer{
  max-width:820px; margin:0 auto; display:flex; gap:8px; align-items:flex-end;
  background:var(--panel); border:1px solid var(--border);
  border-radius:16px; padding:8px 8px 8px 14px;
  transition:border-color .15s;
}
.composer:focus-within{border-color:var(--accent)}
#input{
  flex:1; background:none; border:none; outline:none; resize:none;
  color:var(--fg); font:15px/1.5 inherit; max-height:45vh; min-height:24px;
  padding:6px 0;
}
#input::placeholder{color:var(--muted)}
#send{
  background:var(--accent2); color:#fff; border:none; border-radius:11px;
  width:38px; height:38px; font-size:16px; cursor:pointer; flex:0 0 38px;
  display:flex; align-items:center; justify-content:center; transition:.15s;
}
#send:disabled{opacity:.45; cursor:not-allowed}
#send:not(:disabled):hover{background:#2ea043}

/* ================= mobile ================= */
#backdrop{display:none; position:fixed; inset:0; background:#000a; z-index:35}
@media(max-width:780px){
  #sidebar{
    position:fixed; top:0; bottom:0; left:0;
    transform:translateX(-102%); transition:transform .22s ease;
    box-shadow:0 0 40px #000c; width:282px; flex-basis:282px;
  }
  #sidebar.open{transform:none}
  #backdrop.show{display:block}
  #btn-menu{display:inline-flex}
  .welcome{padding-top:26px}
}
</style>
</head>
<body>

<div class="app">

  <aside id="sidebar">
    <div class="sb-head">
      <span class="logo">🦞</span>
      <div>
        <h1>Puru AI <span style="color:var(--accent)">Web</span></h1>
        <div class="sub">powered by PURU-AI engine</div>
      </div>
    </div>
    <button class="sb-new" id="btn-new-sb">＋ Chat baru</button>
    <div class="sb-label">Riwayat</div>
    <div class="sb-list" id="chat-list"></div>
    <div class="sb-foot" id="sb-foot"><span class="dot"></span><span id="st-text">memuat…</span></div>
  </aside>

  <div id="backdrop"></div>

  <section class="chat">
    <header>
      <button class="hbtn" id="btn-menu" title="Riwayat">☰</button>
      <div class="title">Puru AI <small>chat</small></div>
      <div class="spacer"></div>
      <button class="hbtn" id="btn-fresh" title="Mode memori">🧠 Memori</button>
      <button class="hbtn" id="btn-files" title="File dari Puru">📁<span class="hide-sm"> File</span></button>
      <button class="hbtn" id="btn-new" title="Chat baru">＋ Baru</button>
      <button class="hbtn" id="btn-clear" title="Hapus riwayat chat ini">🗑</button>
    </header>

    <main id="main">
      <div class="wrap" id="wrap"></div>
    </main>

    <footer>
      <div class="attachbar" id="attachbar"></div>
      <div class="composer">
        <button id="btn-attach" title="Lampirkan file ke Puru">📎</button>
        <textarea id="input" rows="1" placeholder="Tulis pesan…"></textarea>
        <button id="send" title="Kirim">➤</button>
      </div>
      <input type="file" id="filepick" multiple hidden>
    </footer>
  </section>

</div>

<div id="filesPanel">
  <div class="fp-card">
    <div class="fp-head">
      <h3>📁 File</h3>
      <button class="act-btn" id="fp-close">Tutup</button>
    </div>
    <div class="fp-body" id="fp-body"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Puru AI Web — client
   - sidebar riwayat chat (klik untuk buka chat lama)
   - chat baru bisa kapan saja (walau AI masih mikir)
   - bubble gaya chat normal (tanpa label "KAMU"/"PURU")
   - tombol "Salin" nempel di blok kode + muncul saat bubble disentuh
   - Enter = baris baru, kirim pakai tombol ➤
   - sesi nempel (localStorage + riwayat server), reload tetap nyambung
   ============================================================ */
const $ = s => document.querySelector(s);
const wrap = $("#wrap"), main = $("#main"), input = $("#input"), send = $("#send");
const sidebar = $("#sidebar"), backdrop = $("#backdrop"), chatList = $("#chat-list"), sbFoot = $("#sb-foot");
let chatId = 0;          // 0 = default slot
let busy = false;
let polling = false;
let gen = 0;             // pembeda request; naik = abaikan respons lama
let freshMode = false;   // true = chat ini tanpa memori jangka panjang

/* ---------------- util ---------------- */
function setChatId(id){
  if(id){ chatId = Number(id); try{ localStorage.setItem("puru_chat_id", String(id)); }catch(e){} }
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
const btnFresh = $("#btn-fresh");
function renderFresh(){
  if(!btnFresh) return;
  btnFresh.innerHTML = freshMode
    ? '✨ Fresh<span class="hide-sm"> · tanpa memori</span>'
    : '🧠 Memori<span class="hide-sm"> ON</span>';
  btnFresh.title = freshMode
    ? "Chat ini mulai dari nol (tanpa MEMORY.md & ringkasan). Klik buat pakai memori."
    : "Memori jangka panjang ON. Klik buat mode fresh (mulai dari nol).";
}
async function toggleFresh(){
  const want = !freshMode;
  try{
    const j = await api("/api/fresh", {method:"POST", body:JSON.stringify({chat_id:chatId, fresh:want})});
    freshMode = !!j.fresh; renderFresh();
  }catch(e){ alert("Gagal ganti mode: " + e.message); }
}
function openSidebar(){ sidebar.classList.add("open"); backdrop.classList.add("show"); }
function closeSidebar(){ sidebar.classList.remove("open"); backdrop.classList.remove("show"); }

/* ---------------- markdown ---------------- */
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function inline(t){
  t = esc(t);
  t = t.replace(/`([^`\n]+)`/g, (m,c)=>`<code class="ic">${c}</code>`);
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  t = t.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return t;
}
function codeBlock(lang, code){
  const label = (lang||"").trim() || "kode";
  return `<div class="codeblock">
    <div class="cb-head">
      <span class="lang">${esc(label)}</span>
      <button class="copy-btn" data-code="${encodeURIComponent(code)}">📋 Salin</button>
    </div>
    <pre><code>${esc(code)}</code></pre>
  </div>`;
}
function md(src){
  const lines = src.replace(/\r\n/g,"\n").split("\n");
  let out = "", i = 0, para = [], listType = null;

  const flushP = ()=>{ if(para.length){ out += "<p>"+para.map(inline).join("<br>")+"</p>"; para=[]; } };
  const closeList = ()=>{ if(listType){ out += "</"+listType+">"; listType=null; } };

  while(i < lines.length){
    const ln = lines[i];

    const fence = ln.match(/^\s*```(.*)$/);
    if(fence){
      flushP(); closeList();
      const lang = fence[1].trim();
      const buf = [];
      i++;
      while(i < lines.length && !/^\s*```\s*$/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out += codeBlock(lang, buf.join("\n"));
      continue;
    }
    const h = ln.match(/^\s{0,3}(#{1,4})\s+(.*)$/);
    if(h){ flushP(); closeList(); const n=h[1].length; out += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if(/^\s{0,3}([-*_])\s*(\1\s*){2,}$/.test(ln)){ flushP(); closeList(); out += "<hr>"; i++; continue; }
    if(/^\s{0,3}>/.test(ln)){
      flushP(); closeList();
      const buf=[];
      while(i<lines.length && /^\s{0,3}>/.test(lines[i])){ buf.push(lines[i].replace(/^\s{0,3}>\s?/,"")); i++; }
      out += "<blockquote>"+md(buf.join("\n"))+"</blockquote>";
      continue;
    }
    const li = ln.match(/^\s{0,3}[-*+]\s+(.*)$/);
    const lo = ln.match(/^\s{0,3}\d+[.)]\s+(.*)$/);
    if(li||lo){
      flushP();
      const t = li ? "ul" : "ol";
      if(listType !== t){ closeList(); out += "<"+t+">"; listType = t; }
      out += "<li>"+inline((li||lo)[1])+"</li>";
      i++; continue;
    }
    if(/^\s*$/.test(ln)){ flushP(); closeList(); i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      flushP(); closeList();
      const head = ln.split("|").slice(1,-1).map(s=>s.trim());
      i+=2;
      const rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        rows.push(lines[i].split("|").slice(1,-1).map(s=>s.trim())); i++;
      }
      out += "<table><thead><tr>"+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"
           + rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")
           + "</tbody></table>";
      continue;
    }
    para.push(ln); i++;
  }
  flushP(); closeList();
  return out;
}

/* ---------------- copy ---------------- */
async function copyText(t){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(t); return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove(); return ok;
  }catch(e){ return false; }
}
function bindCopies(root){
  root.querySelectorAll(".copy-btn").forEach(btn=>{
    if(btn.dataset.bound) return; btn.dataset.bound="1";
    btn.addEventListener("click", async ()=>{
      const ok = await copyText(decodeURIComponent(btn.dataset.code||""));
      const old = btn.innerHTML;
      btn.innerHTML = ok ? "✓ Tersalin" : "✗ Gagal";
      btn.classList.add("done");
      setTimeout(()=>{ btn.innerHTML = old; btn.classList.remove("done"); }, 1500);
    });
  });
}

/* ---------- ketuk bubble → tombol salin muncul ---------- */
wrap.addEventListener("click", async (e)=>{
  const cbtn = e.target.closest("[data-copy-msg]");
  if(cbtn){
    const body = cbtn.closest(".body");
    const ok = await copyText((body && body.dataset.raw) || "");
    const old = cbtn.innerHTML;
    cbtn.innerHTML = ok ? "✓ Tersalin" : "✗ Gagal";
    setTimeout(()=>{ cbtn.innerHTML = old; }, 1500);
    return;
  }
  if(e.target.closest("a,button,pre,.codeblock")) return;
  const body = e.target.closest(".body");
  if(!body) return;
  document.querySelectorAll(".body.show-actions").forEach(b=>{ if(b!==body) b.classList.remove("show-actions"); });
  body.classList.toggle("show-actions");
});

/* ---------------- render ---------------- */
function hideWelcome(){ const w=$("#welcome"); if(w) w.remove(); }
function scrollDown(){ requestAnimationFrame(()=>{ main.scrollTop = main.scrollHeight; }); }

function addMsg(role, text){
  hideWelcome();
  const el = document.createElement("div");
  el.className = "msg " + role;
  const who = role === "user" ? "" : "🦞";
  el.innerHTML = `<div class="who">${who}</div>
    <div class="body">
      <div class="content"></div>
      <div class="bubble-actions"><button class="act-btn" data-copy-msg="1">📋 Salin</button></div>
    </div>`;
  const body = el.querySelector(".body");
  const cont = el.querySelector(".content");
  body.dataset.raw = text;
  if(role === "user"){
    cont.textContent = text;            // plain + aman
    cont.style.whiteSpace = "pre-wrap";
  }else{
    cont.innerHTML = md(text);
    bindCopies(body);                   // tombol salin per blok kode
  }
  wrap.appendChild(el);
  scrollDown();
  return el;
}

function addTyping(){
  hideWelcome();
  const el = document.createElement("div");
  el.className = "msg assistant";
  el.id = "typing";
  el.innerHTML = `<div class="who">🦞</div><div class="body"><div class="typing"><i></i><i></i><i></i></div></div>`;
  wrap.appendChild(el);
  scrollDown();
  return el;
}
function delTyping(){ const t=$("#typing"); if(t) t.remove(); }

function renderWelcome(title, sub){
  wrap.innerHTML = "";
  const d = document.createElement("div");
  d.className = "welcome"; d.id = "welcome";
  d.innerHTML = `<div class="big">🦞</div><h2></h2><p></p>
    <div class="chips">
      <button class="chip">Jelaskan apa itu PURU-AI</button>
      <button class="chip">Buatkan fungsi Python cek bilangan prima</button>
      <button class="chip">Tulis bot Telegram sederhana</button>
      <button class="chip">Ringkas rumus markdown</button>
    </div>`;
  d.querySelector("h2").textContent = title;
  d.querySelector("p").textContent = sub;
  wrap.appendChild(d);
  bindChips();
}
function bindChips(){
  wrap.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click", ()=> sendMsg(c.textContent));
  });
}
function renderAll(msgs){
  wrap.innerHTML = "";
  if(!msgs || !msgs.length){
    renderWelcome("Halo! Puru di sini.", "Tanya apa saja — jawaban teks & kode dibedakan. Ketuk bubble chat buat munculin tombol salin.");
    return;
  }
  msgs.forEach(m=> addMsg(m.role, m.content));
}

/* ---------------- api ---------------- */
async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts));
  const j = await r.json().catch(()=>({error:"respons tidak valid"}));
  if(!r.ok){ const e = new Error(j.message||j.error||("HTTP "+r.status)); e.status=r.status; throw e; }
  return j;
}

async function loadHistory(){
  const j = await api("/api/messages"+(chatId?("?chat_id="+chatId):""));
  setChatId(j.chat_id);
  renderAll(j.messages || []);
}

async function refreshInfo(){
  try{
    const j = await api("/api/info"+(chatId?("?chat_id="+chatId):""));
    setChatId(j.chat_id);
    freshMode = !!j.fresh;
    renderFresh();
    const st = $("#st-text");
    if(st) st.textContent = j.running ? "memproses…" : "online";
    sbFoot.classList.toggle("off", !!j.running);
    return j;
  }catch(e){
    const st = $("#st-text");
    if(st) st.textContent = "offline";
    sbFoot.classList.add("off");
    return null;
  }
}

async function loadChats(){
  let list = [];
  try{
    const j = await api("/api/chats");
    list = (j.chats || []).slice().sort((a,b)=>{
      if(a.id === chatId) return -1;
      if(b.id === chatId) return 1;
      return (b.updated||"").localeCompare(a.updated||"") || (b.id - a.id);
    });
  }catch(e){}
  chatList.innerHTML = "";
  if(!list.length){ chatList.innerHTML = `<div class="sb-empty">Belum ada riwayat.</div>`; return; }
  list.forEach(c=>{
    const b = document.createElement("button");
    b.className = "sb-item" + (Number(c.id) === chatId ? " active" : "");
    const t = document.createElement("span");
    t.className = "sb-t";
    t.textContent = c.title || "(tanpa judul)";
    const m = document.createElement("span");
    m.className = "sb-m";
    m.textContent = (c.updated || "") + (c.messages ? " · " + c.messages + " pesan" : "");
    b.appendChild(t); b.appendChild(m);
    b.addEventListener("click", ()=> openChat(Number(c.id)));
    chatList.appendChild(b);
  });
}

/* nungguin balasan AI yang masih diproses server (reload pas AI mikir) */
async function pollPending(){
  if(polling) return;
  polling = true;
  busy = true; send.disabled = true;
  const myGen = gen;
  addTyping();
  let lastLen = wrap.querySelectorAll(".msg:not(#typing)").length;
  for(let i=0;i<3600;i++){
    await sleep(3000);
    if(myGen !== gen){ polling = false; return; }
    try{
      const j = await api("/api/messages"+(chatId?("?chat_id="+chatId):""));
      if(myGen !== gen){ polling = false; return; }
      const msgs = j.messages || [];
      const inf = await api("/api/info"+(chatId?("?chat_id="+chatId):""));
      if(myGen !== gen){ polling = false; return; }
      if(!inf.running){
        delTyping();
        renderAll(msgs);
        polling = false; busy = false; send.disabled = false;
        refreshInfo(); loadChats();
        return;
      }
      if(msgs.length !== lastLen){   // pertanyaan / jawaban parsial nambah
        lastLen = msgs.length;
        delTyping();
        renderAll(msgs);
        addTyping();
      }
    }catch(e){}
  }
  delTyping();
  polling = false; busy = false; send.disabled = false;
}

/* ---------------- aksi ---------------- */
async function openChat(id){
  id = Number(id);
  if(id === chatId){ closeSidebar(); return; }
  gen++; polling = false; busy = false; send.disabled = false;
  setChatId(id);
  wrap.innerHTML = "";
  try{ await loadHistory(); }catch(e){ renderWelcome("Gagal memuat", e.message); }
  closeSidebar();
  const info = await refreshInfo();
  if(info && info.running) pollPending();
  loadChats();
  input.focus();
}

async function newChat(){
  try{
    const j = await api("/api/new_chat", {method:"POST", body:"{}"});
    gen++; polling = false; busy = false; send.disabled = false;
    setChatId(j.chat_id);
    freshMode = true; renderFresh();
    renderWelcome("Chat baru ✨ (fresh)", "Percakapan mulai dari nol — tanpa memori jangka panjang. Riwayat lama tetap ada di sidebar.");
    closeSidebar();
    refreshInfo(); loadChats(); input.focus();
  }catch(e){ alert("Gagal: " + e.message); }
}

async function clearChat(){
  if(!confirm("Hapus riwayat chat ini?")) return;
  try{
    await api("/api/clear", {method:"POST", body:JSON.stringify({chat_id:chatId})});
    gen++; polling = false; busy = false; send.disabled = false;
    freshMode = true; renderFresh();
    renderWelcome("Riwayat dihapus ✨", "Riwayat chat dibersihin & mode fresh aktif (mulai dari nol). Mulai lagi kapan saja.");
    refreshInfo(); loadChats();
  }catch(e){
    if(e.status === 409) alert("Chat ini masih diproses, coba lagi nanti.");
    else alert("Gagal: " + e.message);
  }
}

async function sendMsg(text){
  text = (text || "").trim();
  if((!text && !attachments.length) || busy) return;
  const payload = withAttachments(text);
  busy = true; send.disabled = true;
  const myGen = ++gen;
  addMsg("user", payload);
  input.value = ""; autosize();
  addTyping();
  try{
    const j = await api("/api/chat", {method:"POST", body:JSON.stringify({message:payload, chat_id:chatId})});
    if(myGen !== gen) return;
    delTyping();
    setChatId(j.chat_id);
    const el = addMsg("assistant", j.reply || "(kosong)");
    addFiles(el, j.files);
    attachments = []; renderAttach();
    refreshInfo(); loadChats();
  }catch(e){
    if(myGen !== gen) return;
    delTyping();
    if(e.status === 409){
      addMsg("assistant", "⏳ " + (e.message || "Masih memproses pertanyaan sebelumnya…"));
    }else{
      addMsg("assistant", "⚠️ Error: " + e.message);
    }
  }finally{
    if(myGen === gen){ busy = false; send.disabled = false; input.focus(); }
  }
}

/* ---------------- file: kirim ke Puru & ambil dari Puru ---------------- */
let attachments = [];
const attachBar = $("#attachbar"), filePick = $("#filepick");

function fmtSize(n){
  n = Number(n || 0);
  if(n < 1024) return n + " B";
  if(n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}
function renderAttach(){
  if(!attachBar) return;
  attachBar.innerHTML = "";
  attachBar.classList.toggle("on", attachments.length > 0);
  attachments.forEach((a,i)=>{
    const d = document.createElement("div");
    d.className = "attach-chip";
    d.innerHTML = '<span>\uD83D\uDCCE</span><span class="nm"></span><span class="sz"></span><button class="rm" title="Hapus lampiran">\u2715</button>';
    d.querySelector(".nm").textContent = a.name;
    d.querySelector(".sz").textContent = fmtSize(a.size);
    d.querySelector(".rm").addEventListener("click", ()=>{ attachments.splice(i,1); renderAttach(); });
    attachBar.appendChild(d);
  });
}
function withAttachments(t){
  if(!attachments.length) return t;
  const head = attachments.map(a=>"[Lampiran: " + a.path + "]").join("\n");
  return t ? head + "\n" + t : head;
}
var IMG_EXT = ["png","jpg","jpeg","gif","webp","bmp","avif","svg"];
var VID_EXT = ["mp4","webm","mov","m4v","ogv","mkv"];
function extOf(name){ var m = /\.([a-z0-9]+)$/i.exec(name || ""); return m ? m[1].toLowerCase() : ""; }
function isImage(name){ return IMG_EXT.indexOf(extOf(name)) >= 0; }
function isVideo(name){ return VID_EXT.indexOf(extOf(name)) >= 0; }
function inlineUrl(u){ u = u || ""; return u + (u.indexOf("?") >= 0 ? "&" : "?") + "inline=1"; }
function mediaEl(f){
  if(isImage(f.name)){
    const img = document.createElement("img");
    img.className = "fmedia"; img.src = inlineUrl(f.url); img.loading = "lazy";
    img.alt = f.name || "gambar"; img.title = "Klik untuk buka ukuran penuh";
    img.addEventListener("click", ()=>{ window.open(inlineUrl(f.url), "_blank"); });
    return img;
  }
  if(isVideo(f.name)){
    const v = document.createElement("video");
    v.className = "fmedia"; v.src = inlineUrl(f.url); v.controls = true;
    v.preload = "metadata"; v.playsInline = true;
    return v;
  }
  return null;
}
function addFiles(el, files){
  if(!el || !files || !files.length) return;
  const body = el.querySelector(".body");
  if(!body) return;
  const box = document.createElement("div");
  box.className = "msg-files";
  files.forEach(f=>{
    const prev = mediaEl(f);
    if(prev) box.appendChild(prev);
    const a = document.createElement("a");
    a.className = "fchip";
    a.href = f.url; a.setAttribute("download", f.name || "");
    a.innerHTML = '<span>\uD83D\uDCC4</span><span class="nm"></span><span class="sz"></span><span>\u2b07</span>';
    a.querySelector(".nm").textContent = f.name || "file";
    a.querySelector(".sz").textContent = fmtSize(f.size);
    a.title = f.caption ? (f.name + " \u2014 " + f.caption) : f.name;
    box.appendChild(a);
  });
  body.appendChild(box);
  scrollDown();
}
if($("#btn-attach")) $("#btn-attach").addEventListener("click", ()=> filePick.click());
if(filePick) filePick.addEventListener("change", async ()=>{
  const picked = Array.from(filePick.files || []);
  for(const f of picked){
    const fd = new FormData();
    fd.append("file", f, f.name);
    try{
      const r = await fetch("/api/upload", {method:"POST", body:fd});
      const j = await r.json().catch(()=>({error:"respons tidak valid"}));
      if(!r.ok) throw new Error(j.message || j.error || ("HTTP " + r.status));
      attachments.push({name: j.name || f.name, path: j.path, size: j.size});
    }catch(e){ alert("Gagal unggah " + f.name + ": " + e.message); }
  }
  filePick.value = "";
  renderAttach();
});
async function openFiles(){
  const panel = $("#filesPanel"), body = $("#fp-body");
  if(!panel || !body) return;
  panel.classList.add("show");
  body.innerHTML = '<div class="fp-empty">Memuat\u2026</div>';
  try{
    const j = await api("/api/files" + (chatId ? ("?chat_id=" + chatId) : ""));
    const items = j.files || [];
    if(!items.length){
      body.innerHTML = '<div class="fp-empty">Belum ada file. Lampirkan file pakai \uD83D\uDCCE, atau minta Puru bikin file \u2014 hasilnya muncul di sini dan bisa langsung diunduh.</div>';
      return;
    }
    body.innerHTML = "";
    items.forEach(f=>{
      const row = document.createElement("div");
      row.className = "fp-row";
      row.innerHTML = '<span class="ic">\uD83D\uDCC4</span><span class="meta"><span class="n"></span><span class="d"></span></span><span class="acts"><a class="play" target="_blank" rel="noopener">\u25b6</a><a class="dl">\u2b07</a></span>';
      row.querySelector(".n").textContent = f.name || "file";
      row.querySelector(".d").textContent = [fmtSize(f.size), f.time, f.src].filter(Boolean).join(" \u00b7 ");
      const ic = row.querySelector(".ic");
      if(isImage(f.name)){
        const im = document.createElement("img");
        im.className = "fp-thumb"; im.src = inlineUrl(f.url); im.loading = "lazy"; im.alt = f.name || "";
        ic.replaceWith(im);
      }
      const pl = row.querySelector(".play"), dl = row.querySelector(".dl");
      if(isImage(f.name) || isVideo(f.name)){
        pl.href = inlineUrl(f.url);
        pl.textContent = isVideo(f.name) ? "\u25b6 Putar" : "\uD83D\uDDBC Buka";
      } else { pl.remove(); }
      dl.href = f.url; dl.setAttribute("download", "");
      body.appendChild(row);
    });
  }catch(e){
    body.innerHTML = '<div class="fp-empty">Gagal memuat daftar file.</div>';
  }
}
if($("#btn-files")) $("#btn-files").addEventListener("click", openFiles);
if($("#fp-close")) $("#fp-close").addEventListener("click", ()=> $("#filesPanel").classList.remove("show"));
if($("#filesPanel")) $("#filesPanel").addEventListener("click", e=>{ if(e.target.id === "filesPanel") $("#filesPanel").classList.remove("show"); });

/* ---------------- composer ---------------- */
function autosize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, Math.round(window.innerHeight * 0.45)) + "px";
}
input.addEventListener("input", autosize);
send.addEventListener("click", ()=> sendMsg(input.value));

/* ---------------- tombol ---------------- */
$("#btn-fresh").addEventListener("click", toggleFresh);
$("#btn-new").addEventListener("click", newChat);
$("#btn-new-sb").addEventListener("click", newChat);
$("#btn-clear").addEventListener("click", clearChat);
$("#btn-menu").addEventListener("click", openSidebar);
backdrop.addEventListener("click", closeSidebar);
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeSidebar(); });

/* ---------------- boot ---------------- */
(async function(){
  try{
    const saved = parseInt(localStorage.getItem("puru_chat_id")||"0", 10);
    if(saved > 0) chatId = saved;
  }catch(e){}
  renderFresh();
  try{ await loadHistory(); }
  catch(e){ renderWelcome("Halo! Puru di sini.", "Tanya apa saja — jawaban teks & kode dibedakan."); }
  await loadChats();
  const info = await refreshInfo();
  if(info && info.running) pollPending();   // reload pas AI mikir → nunggu, jawaban muncul sendiri
  setInterval(()=>{ refreshInfo(); }, 15000);
  input.focus();
})();
</script>
