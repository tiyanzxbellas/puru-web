<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a0e">
<meta name="color-scheme" content="dark">
<title>Puru AI — Web Console</title>
<style>
/* ============================================================
   Puru AI Web Console — design tokens
   ============================================================ */
:root{
  --bg:#080a0e;
  --surface:#10141b;
  --surface-2:#151b24;
  --surface-3:#1b2230;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);
  --text:#e9eef6;
  --text-2:#b3bdcb;
  --muted:#7c8698;
  --accent:#7c9cff;
  --accent-2:#5b7cfa;
  --accent-soft:rgba(124,156,255,.13);
  --accent-line:rgba(124,156,255,.38);
  --ok:#3ecf8e;
  --warn:#e3b341;
  --danger:#f2707a;
  --radius:14px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 18px 50px rgba(0,0,0,.5);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;max-width:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(1100px 520px at 12% -12%, rgba(124,156,255,.075), transparent 62%),
    radial-gradient(900px 480px at 100% -6%, rgba(62,207,142,.045), transparent 58%),
    var(--bg);
  color:var(--text);
  font:15px/1.6 var(--font);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::selection{background:rgba(124,156,255,.3)}
:focus-visible{outline:2px solid var(--accent-line); outline-offset:2px; border-radius:6px}
button{font-family:inherit}
svg{display:block; flex:0 0 auto}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:content-box}

.app{display:flex;height:100%;width:100%}

/* ================= sidebar ================= */
#sidebar{
  width:272px;flex:0 0 272px;
  background:linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,0) 40%), var(--surface);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:40;
}
.sb-head{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  color:#0a0d13;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(91,124,250,.32), inset 0 1px 0 rgba(255,255,255,.35);
}
.brand-txt h1{margin:0;font-size:14.5px;font-weight:650;letter-spacing:.2px;line-height:1.2}
.brand-txt span{font-size:11px;color:var(--muted);letter-spacing:.3px}
.sb-new{
  margin:6px 12px 2px;padding:10px 12px;border-radius:11px;
  border:1px solid var(--line-2);
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  color:var(--text);font:600 13px/1 var(--font);cursor:pointer;
  display:flex;align-items:center;gap:9px;justify-content:center;
  transition:border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease);
}
.sb-new:hover{border-color:var(--accent-line);background:var(--accent-soft);transform:translateY(-1px)}
.sb-new:active{transform:translateY(0) scale(.99)}
.sb-label{
  font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--muted);padding:16px 18px 6px;font-weight:600;
}
.sb-list{flex:1;overflow-y:auto;padding:2px 8px 16px;display:flex;flex-direction:column;gap:2px}
.sb-item{
  position:relative;display:block;text-align:left;width:100%;
  background:transparent;border:1px solid transparent;border-radius:10px;
  padding:9px 12px 9px 14px;color:var(--text);cursor:pointer;font:inherit;
  transition:background .16s var(--ease), border-color .16s var(--ease), transform .16s var(--ease);
}
.sb-item::before{
  content:"";position:absolute;left:5px;top:50%;transform:translateY(-50%) scaleY(.2);
  width:2px;height:62%;border-radius:2px;background:var(--accent);
  opacity:0;transition:opacity .18s var(--ease), transform .18s var(--ease);
}
.sb-item:hover{background:rgba(255,255,255,.035);transform:translateX(1px)}
.sb-item.active{background:var(--accent-soft);border-color:var(--accent-line)}
.sb-item.active::before{opacity:1;transform:translateY(-50%) scaleY(1)}
.sb-item .sb-t{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.sb-item .sb-m{font-size:10.5px;color:var(--muted);letter-spacing:.2px}
.sb-empty{color:var(--muted);font-size:12px;padding:10px 14px;line-height:1.6}
.sb-skel{height:44px;border-radius:10px;margin:4px 6px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:220% 100%;animation:shimmer 1.4s infinite linear}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.sb-foot{
  border-top:1px solid var(--line);padding:11px 16px;
  font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;
}
.sb-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.14);transition:.2s}
.sb-foot.off .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(227,179,65,.14)}
.sb-foot.busy .dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ================= chat column ================= */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.chat header{
  position:relative;display:flex;align-items:center;gap:8px;
  padding:10px 14px;min-height:56px;
  background:rgba(16,20,27,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.chat header .title{display:flex;flex-direction:column;gap:1px;min-width:0}
.chat header .title strong{font-size:13.5px;font-weight:620;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.chat header .status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.2px}
.chat header .status i{width:6px;height:6px;border-radius:50%;background:var(--ok);font-style:normal;transition:.2s}
.chat header.busy .status i{background:var(--accent);animation:pulse 1.2s infinite}
.chat header.busy .status span{color:var(--accent)}
.chat header .spacer{flex:1}
#topbar{
  position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;
  opacity:0;transition:opacity .25s var(--ease);pointer-events:none;
}
#topbar.on{opacity:1}
#topbar::after{
  content:"";position:absolute;inset:0;width:38%;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:slide 1.35s infinite var(--ease);
}
@keyframes slide{from{transform:translateX(-110%)}to{transform:translateX(300%)}}

.hbtn,.icon-btn{
  background:rgba(255,255,255,.04);color:var(--text-2);border:1px solid var(--line-2);
  border-radius:10px;cursor:pointer;transition:all .16s var(--ease);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:34px;font-size:12.5px;font-weight:550;
}
.hbtn{padding:0 12px}
.icon-btn{width:34px;padding:0}
.hbtn:hover,.icon-btn:hover{border-color:var(--accent-line);color:var(--text);background:var(--accent-soft)}
.hbtn:active,.icon-btn:active{transform:scale(.96)}
.icon-btn.danger:hover{border-color:rgba(242,112,122,.5);color:var(--danger);background:rgba(242,112,122,.1)}
#btn-menu{display:none}
#btn-fresh.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

main{flex:1;overflow-y:auto;padding:24px 14px 10px;scroll-behavior:smooth;overscroll-behavior:contain}
.wrap{max-width:840px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ---- messages ---- */
.msg{display:flex;gap:12px;align-items:flex-start}
.msg.anim{animation:enter .34s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
.msg .who{
  width:32px;height:32px;border-radius:10px;flex:0 0 32px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  color:var(--accent);background:var(--surface-2);border:1px solid var(--line-2);
  box-shadow:var(--shadow-1);
}
.msg.user{justify-content:flex-end}
.msg.user .who{display:none}
.body{min-width:0;flex:1;position:relative}
.msg .body{max-width:min(88%,760px)}
.msg.user .body{
  background:linear-gradient(180deg, rgba(124,156,255,.16), rgba(124,156,255,.10));
  border:1px solid rgba(124,156,255,.3);
  padding:10px 14px;border-radius:14px 14px 5px 14px;flex:0 1 auto;
}
.msg.assistant .body{
  background:var(--surface);border:1px solid var(--line);
  padding:12px 16px;border-radius:5px 14px 14px 14px;
  box-shadow:var(--shadow-1);
}
.content{word-wrap:break-word;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;color:var(--text)}
.content>*:first-child{margin-top:0!important}
.content>*:last-child{margin-bottom:0!important}
.content p{margin:.5em 0}
.content h1,.content h2,.content h3,.content h4{margin:.85em 0 .35em;line-height:1.28;font-weight:640;letter-spacing:.1px}
.content h1{font-size:1.32em}.content h2{font-size:1.18em}.content h3{font-size:1.05em}.content h4{font-size:1em;color:var(--text-2)}
.content ul,.content ol{margin:.4em 0;padding-left:1.45em}
.content li{margin:.22em 0}
.content li::marker{color:var(--muted)}
.content a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(124,156,255,.35)}
.content a:hover{border-bottom-color:var(--accent)}
.content hr{border:none;border-top:1px solid var(--line);margin:.9em 0}
.content blockquote{
  margin:.5em 0;padding:6px 14px;border-left:2px solid var(--accent-line);
  color:var(--text-2);background:rgba(124,156,255,.055);border-radius:0 10px 10px 0;
}
.content table{border-collapse:collapse;margin:.5em 0;font-size:13.5px;display:block;overflow-x:auto;max-width:100%}
.content th,.content td{border:1px solid var(--line-2);padding:6px 11px;text-align:left}
.content th{background:var(--surface-2);font-weight:620;color:var(--text)}
.content strong{color:#fff;font-weight:640}
.content em{color:var(--text-2)}
.content del{color:var(--muted)}
.content code.ic{
  background:rgba(124,156,255,.10);padding:2px 6px;border-radius:6px;
  font:12.5px/1.45 var(--mono);color:#9db4ff;border:1px solid rgba(124,156,255,.16);
}
/* code block */
.codeblock{margin:.7em 0;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:#0a0d13}
.cb-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 10px 7px 13px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);
}
.cb-head .lang{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:650;color:var(--muted)}
.cb-head .cbdots{display:flex;gap:5px}
.cb-head .cbdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.12)}
.copy-btn{
  background:rgba(255,255,255,.055);color:var(--text-2);border:1px solid var(--line-2);
  border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:600;cursor:pointer;
  transition:all .16s var(--ease);display:inline-flex;align-items:center;gap:6px;
}
.copy-btn:hover{color:var(--text);border-color:var(--accent-line);background:var(--accent-soft)}
.copy-btn.done{color:var(--ok);border-color:rgba(62,207,142,.45);background:rgba(62,207,142,.1)}
.codeblock pre{margin:0;padding:13px 15px;overflow-x:auto;font:12.8px/1.6 var(--mono);color:#c8d3e0;tab-size:2}
/* actions row */
.bubble-actions{display:none;gap:8px;align-items:center;margin-top:9px}
.msg .body.show-actions .bubble-actions{display:flex;animation:enter .2s var(--ease)}
.bubble-actions .stamp{font-size:10.5px;color:var(--muted);letter-spacing:.3px}
.msg.user .bubble-actions{justify-content:flex-end}
.act-btn{
  background:rgba(255,255,255,.045);color:var(--muted);border:1px solid var(--line-2);
  border-radius:8px;padding:4px 10px;font-size:11.5px;cursor:pointer;
  transition:all .16s var(--ease);display:inline-flex;align-items:center;gap:6px;
}
.act-btn:hover{color:var(--text);border-color:var(--accent-line);background:var(--accent-soft)}
.act-btn.done{color:var(--ok);border-color:rgba(62,207,142,.45)}
/* streaming caret */
.typing-out .content::after{
  content:"";display:inline-block;width:2px;height:1.05em;margin-left:3px;vertical-align:-.16em;
  background:var(--accent);animation:caret .9s steps(1) infinite;
}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ---- thinking ---- */
.typing-msg .body{background:var(--surface);border:1px solid var(--line);border-radius:5px 14px 14px 14px;padding:12px 16px}
.msg.typing-msg .who{color:var(--accent);animation:whoPulse 1.6s infinite var(--ease)}
@keyframes whoPulse{0%,100%{box-shadow:0 0 0 0 rgba(124,156,255,.22)}50%{box-shadow:0 0 0 7px rgba(124,156,255,0)}}
.thinking{display:flex;align-items:center;gap:11px}
.tdots{display:flex;gap:4px}
.tdots i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.35;animation:tdot 1.25s infinite var(--ease)}
.tdots i:nth-child(2){animation-delay:.15s}
.tdots i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.tstage{font-size:12.5px;color:var(--text-2);letter-spacing:.2px}
.tstage::after{content:"";display:inline-block;width:12px;text-align:left;animation:dots 1.6s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.tsec{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:8px}

/* ---- welcome ---- */
.welcome{text-align:center;padding:46px 16px 24px;color:var(--muted);animation:enter .4s var(--ease) both}
.welcome .wmark{
  width:56px;height:56px;margin:0 auto 16px;border-radius:16px;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#0a0d13;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 40px rgba(91,124,250,.3), inset 0 1px 0 rgba(255,255,255,.35);
}
.welcome h2{color:var(--text);margin:0 0 8px;font-size:22px;font-weight:640;letter-spacing:-.2px}
.welcome p{margin:0 auto 26px;font-size:13.5px;max-width:440px;line-height:1.65}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;margin:0 auto}
.chip{
  position:relative;text-align:left;background:rgba(255,255,255,.028);border:1px solid var(--line);
  color:var(--text-2);padding:13px 14px;border-radius:12px;font-size:13px;cursor:pointer;
  transition:border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease), color .18s var(--ease);
  display:flex;align-items:flex-start;gap:10px;line-height:1.45;
  animation:enter .4s var(--ease) both;
}
.chip:nth-child(1){animation-delay:.04s}.chip:nth-child(2){animation-delay:.1s}
.chip:nth-child(3){animation-delay:.16s}.chip:nth-child(4){animation-delay:.22s}
.chip svg{color:var(--accent);margin-top:1px;opacity:.85}
.chip:hover{border-color:var(--accent-line);background:var(--accent-soft);color:var(--text);transform:translateY(-2px)}
.chip:active{transform:translateY(0) scale(.99)}

/* ---- attachments & files ---- */
.attachbar{max-width:840px;margin:0 auto 8px;display:none;gap:7px;flex-wrap:wrap}
.attachbar.on{display:flex;animation:enter .22s var(--ease)}
.attach-chip{
  display:inline-flex;align-items:center;gap:8px;max-width:100%;
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;
  padding:6px 8px 6px 11px;font-size:12px;color:var(--text);
}
.attach-chip .nm{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-chip .sz{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.attach-chip .rm{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;display:flex;border-radius:6px}
.attach-chip .rm:hover{color:var(--danger);background:rgba(242,112,122,.1)}
#btn-attach{
  background:rgba(255,255,255,.04);color:var(--text-2);border:1px solid var(--line-2);
  border-radius:11px;width:38px;height:38px;flex:0 0 38px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .16s var(--ease);
}
#btn-attach:hover{border-color:var(--accent-line);color:var(--text);background:var(--accent-soft)}

.msg-files{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.fchip{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:rgba(124,156,255,.09);border:1px solid rgba(124,156,255,.3);color:var(--text-2);
  border-radius:10px;padding:7px 11px;font-size:12.5px;transition:all .16s var(--ease);max-width:100%;
  animation:enter .26s var(--ease) both;
}
.fchip:hover{border-color:var(--accent-line);color:var(--text);background:rgba(124,156,255,.16);transform:translateY(-1px)}
.fchip .nm{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip .sz{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}

#filesPanel{position:fixed;inset:0;background:rgba(4,6,9,.7);backdrop-filter:blur(4px);z-index:60;display:none}
#filesPanel.show{display:flex;align-items:center;justify-content:center;padding:16px;animation:enter .2s var(--ease)}
.fp-card{
  background:var(--surface);border:1px solid var(--line-2);border-radius:16px;
  width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow-2);
}
.fp-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.fp-head h3{margin:0;font-size:14px;flex:1;font-weight:620;display:flex;align-items:center;gap:9px;color:var(--text)}
.fp-body{overflow-y:auto;padding:8px 10px 14px}
.fp-row{display:flex;align-items:center;gap:11px;padding:10px;border-radius:10px;transition:background .16s var(--ease)}
.fp-row:hover{background:rgba(255,255,255,.035)}
.fp-row .ic{width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--accent)}
.fp-row .meta{flex:1;min-width:0}
.fp-row .n{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-row .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fp-row a{background:rgba(255,255,255,.05);color:var(--text-2);text-decoration:none;border:1px solid var(--line-2);
  border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:600;white-space:nowrap;
  transition:all .16s var(--ease);display:inline-flex;align-items:center;gap:6px}
.fp-row a:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.fp-row .acts{display:flex;gap:6px}
.fp-thumb{width:38px;height:38px;object-fit:cover;border-radius:9px;flex:0 0 38px;background:#000;border:1px solid var(--line)}
.fmedia{max-width:100%;max-height:320px;border-radius:12px;display:block;background:#000;cursor:pointer;margin-bottom:2px;border:1px solid var(--line)}
.fmedia-err{max-width:100%;border:1px dashed var(--line-2);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--muted);background:rgba(0,0,0,.35);line-height:1.6}
.fmedia-audio{background:transparent;max-height:none;width:100%;min-width:min(300px,100%);margin-bottom:4px;border:none}
.fp-empty{color:var(--muted);font-size:12.5px;padding:16px 14px;line-height:1.7}

/* ---- composer ---- */
footer{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent, var(--bg) 42%)}
.composer{
  max-width:840px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
  background:var(--surface);border:1px solid var(--line-2);
  border-radius:18px;padding:8px 8px 8px 12px;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
  box-shadow:var(--shadow-1);
}
.composer:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft), var(--shadow-1)}
#input{
  flex:1;background:none;border:none;outline:none;resize:none;
  color:var(--text);font:15px/1.55 var(--font);max-height:45vh;min-height:26px;padding:7px 0;
}
#input::placeholder{color:var(--muted)}
#send{
  background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#0a0d13;border:none;border-radius:12px;
  width:38px;height:38px;cursor:pointer;flex:0 0 38px;
  display:flex;align-items:center;justify-content:center;
  transition:filter .16s var(--ease), transform .16s var(--ease), opacity .2s;
  box-shadow:0 6px 18px rgba(91,124,250,.28);
}
#send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
#send:not(:disabled):hover{filter:brightness(1.08)}
#send:not(:disabled):active{transform:scale(.94)}
.composer.busy #send{background:var(--surface-3);color:var(--muted);box-shadow:none}
.hint{max-width:840px;margin:8px auto 0;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.2px}

/* ================= mobile ================= */
#backdrop{display:none;position:fixed;inset:0;background:rgba(4,6,9,.62);backdrop-filter:blur(2px);z-index:35}
@media(max-width:780px){
  #sidebar{
    position:fixed;top:0;bottom:0;left:0;
    transform:translateX(-102%);transition:transform .26s var(--ease);
    box-shadow:var(--shadow-2);width:286px;flex-basis:286px;
  }
  #sidebar.open{transform:none}
  #backdrop.show{display:block;animation:enter .2s var(--ease)}
  #btn-menu{display:inline-flex}

  .cards{grid-template-columns:1fr}
  main{padding:18px 12px 8px}
}
@media(max-width:520px){
  .hide-sm{display:none!important}
  .chat header .title strong{max-width:38vw}
  .msg .body{max-width:94%}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  main{scroll-behavior:auto}
}

<script>
"use strict";
/* ============================================================
   Puru AI Web Console — client
   - sidebar riwayat chat
   - bubble gaya chat normal (tanpa label peran)
   - indikator proses bertahap + progress bar
   - jawaban muncul dengan animasi "menulis" (typing reveal)
   - tombol salin di blok kode & di bubble
   ============================================================ */
const $ = s => document.querySelector(s);
const wrap = $("#wrap"), main = $("#main"), input = $("#input"), send = $("#send");
const sidebar = $("#sidebar"), backdrop = $("#backdrop"), chatList = $("#chat-list"), sbFoot = $("#sb-foot");
const chatHeader = $("#chat-header"), topbar = $("#topbar"), composer = $("#composer");
let chatId = 0;
let busy = false;
let polling = false;
let gen = 0;
let freshMode = false;

/* ---------------- icons (inline svg, tanpa dependensi) ---------------- */
const IC = {
  copy:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  file:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>',
  image:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5L5 20"/></svg>',
  video:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2z"/></svg>',
  music:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
  download:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 12l5 5 5-5M5 20h14"/></svg>',
  spark:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.1L19 10l-4.8 1.9L12 17l-2.2-5.1L5 10l4.8-1.9z"/></svg>',
  brain:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4a3 3 0 00-3 3 3 3 0 00-2 5.2A3 3 0 006 17.5 3 3 0 009 20a3 3 0 003-3V7a3 3 0 00-3-3z"/><path d="M15 4a3 3 0 013 3 3 3 0 012 5.2A3 3 0 0118 17.5 3 3 0 0115 20a3 3 0 01-3-3"/></svg>',
  chat:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L4 21l1.8-5.5A8 8 0 1121 12z"/></svg>',
  code:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/></svg>',
  send:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 8 6 8z"/></svg>'
};
function fileIcon(name){
  if(isAudio(name)) return IC.music;
  if(isVideo(name)) return IC.video;
  if(isImage(name)) return IC.image;
  return IC.file;
}

/* ---------------- util ---------------- */
function setChatId(id){
  if(id){ chatId = Number(id); try{ localStorage.setItem("puru_chat_id", String(id)); }catch(e){} }
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function timeStamp(){ const d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function syncStatus(){
  const running = busy || polling || !!$("#typing");
  topbar.classList.toggle("on", running);
  chatHeader.classList.toggle("busy", running);
  composer.classList.toggle("busy", running);
  const cs = $("#chat-status");
  if(cs) cs.textContent = running ? "memproses" : "siap";
  sbFoot.classList.toggle("busy", running);
}

const btnFresh = $("#btn-fresh");
function renderFresh(){
  if(!btnFresh) return;
  btnFresh.innerHTML = freshMode
    ? IC.spark + '<span class="hide-sm">Fresh</span>'
    : IC.brain + '<span class="hide-sm">Memori</span>';
  btnFresh.classList.toggle("on", freshMode);
  btnFresh.title = freshMode
    ? "Chat ini mulai dari nol (tanpa MEMORY.md & ringkasan). Klik buat pakai memori."
    : "Memori jangka panjang ON. Klik buat mode fresh (mulai dari nol).";
}
async function toggleFresh(){
  const want = !freshMode;
  try{
    const j = await api("/api/fresh", {method:"POST", body:JSON.stringify({chat_id:chatId, fresh:want})});
    freshMode = !!j.fresh; renderFresh();
  }catch(e){ alert("Gagal ganti mode: " + e.message); }
}
function openSidebar(){ sidebar.classList.add("open"); backdrop.classList.add("show"); }
function closeSidebar(){ sidebar.classList.remove("open"); backdrop.classList.remove("show"); }

/* ---------------- markdown ---------------- */
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function inline(t){
  t = esc(t);
  t = t.replace(/`([^`\n]+)`/g, (m,c)=>`<code class="ic">${c}</code>`);
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  t = t.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return t;
}
function codeBlock(lang, code){
  const label = (lang||"").trim() || "kode";
  return `<div class="codeblock">
    <div class="cb-head">
      <span class="lang">${esc(label)}</span>
      <button class="copy-btn" data-code="${encodeURIComponent(code)}">${IC.copy}<span>Salin</span></button>
    </div>
    <pre><code>${esc(code)}</code></pre>
  </div>`;
}
function md(src){
  const lines = src.replace(/\r\n/g,"\n").split("\n");
  let out = "", i = 0, para = [], listType = null;

  const flushP = ()=>{ if(para.length){ out += "<p>"+para.map(inline).join("<br>")+"</p>"; para=[]; } };
  const closeList = ()=>{ if(listType){ out += "</"+listType+">"; listType=null; } };

  while(i < lines.length){
    const ln = lines[i];

    const fence = ln.match(/^\s*```(.*)$/);
    if(fence){
      flushP(); closeList();
      const lang = fence[1].trim();
      const buf = [];
      i++;
      while(i < lines.length && !/^\s*```\s*$/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out += codeBlock(lang, buf.join("\n"));
      continue;
    }
    const h = ln.match(/^\s{0,3}(#{1,4})\s+(.*)$/);
    if(h){ flushP(); closeList(); const n=h[1].length; out += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if(/^\s{0,3}([-*_])\s*(\1\s*){2,}$/.test(ln)){ flushP(); closeList(); out += "<hr>"; i++; continue; }
    if(/^\s{0,3}>/.test(ln)){
      flushP(); closeList();
      const buf=[];
      while(i<lines.length && /^\s{0,3}>/.test(lines[i])){ buf.push(lines[i].replace(/^\s{0,3}>\s?/,"")); i++; }
      out += "<blockquote>"+md(buf.join("\n"))+"</blockquote>";
      continue;
    }
    const li = ln.match(/^\s{0,3}[-*+]\s+(.*)$/);
    const lo = ln.match(/^\s{0,3}\d+[.)]\s+(.*)$/);
    if(li||lo){
      flushP();
      const t = li ? "ul" : "ol";
      if(listType !== t){ closeList(); out += "<"+t+">"; listType = t; }
      out += "<li>"+inline((li||lo)[1])+"</li>";
      i++; continue;
    }
    if(/^\s*$/.test(ln)){ flushP(); closeList(); i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      flushP(); closeList();
      const head = ln.split("|").slice(1,-1).map(s=>s.trim());
      i+=2;
      const rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        rows.push(lines[i].split("|").slice(1,-1).map(s=>s.trim())); i++;
      }
      out += "<table><thead><tr>"+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"
           + rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")
           + "</tbody></table>";
      continue;
    }
    para.push(ln); i++;
  }
  flushP(); closeList();
  return out;
}

/* ---------------- copy ---------------- */
async function copyText(t){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(t); return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove(); return ok;
  }catch(e){ return false; }
}
function bindCopies(root){
  root.querySelectorAll(".copy-btn").forEach(btn=>{
    if(btn.dataset.bound) return; btn.dataset.bound="1";
    btn.addEventListener("click", async ()=>{
      const ok = await copyText(decodeURIComponent(btn.dataset.code||""));
      btn.classList.add("done");
      btn.innerHTML = ok ? IC.check + "<span>Tersalin</span>" : IC.copy + "<span>Gagal</span>";
      setTimeout(()=>{ btn.classList.remove("done"); btn.innerHTML = IC.copy + "<span>Salin</span>"; }, 1600);
    });
  });
}

/* ---------- ketuk bubble → tombol salin muncul ---------- */
wrap.addEventListener("click", async (e)=>{
  const cbtn = e.target.closest("[data-copy-msg]");
  if(cbtn){
    const body = cbtn.closest(".body");
    const ok = await copyText((body && body.dataset.raw) || "");
    const old = cbtn.innerHTML;
    cbtn.classList.toggle("done", ok);
    cbtn.innerHTML = ok ? IC.check + "<span>Tersalin</span>" : IC.copy + "<span>Gagal</span>";
    setTimeout(()=>{ cbtn.classList.remove("done"); cbtn.innerHTML = old; }, 1600);
    return;
  }
  if(e.target.closest("a,button,pre,.codeblock")) return;
  const body = e.target.closest(".body");
  if(!body) return;
  document.querySelectorAll(".body.show-actions").forEach(b=>{ if(b!==body) b.classList.remove("show-actions"); });
  body.classList.toggle("show-actions");
});

/* ---------------- render ---------------- */
function hideWelcome(){ const w=$("#welcome"); if(w) w.remove(); }
function atBottom(){ return main.scrollHeight - main.scrollTop - main.clientHeight < 140; }
function scrollDown(force){
  if(!force && !atBottom()) return;
  requestAnimationFrame(()=>{ main.scrollTop = main.scrollHeight; });
}

function addMsg(role, text, animate){
  hideWelcome();
  const el = document.createElement("div");
  el.className = "msg " + role + (animate ? " anim" : "");
  const who = role === "user"
    ? ""
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.1L19 10l-4.8 1.9L12 17l-2.2-5.1L5 10l4.8-1.9z"/></svg>';
  el.innerHTML = `<div class="who">${who}</div>
    <div class="body">
      <div class="content"></div>
      <div class="bubble-actions"><span class="stamp">${timeStamp()}</span><button class="act-btn" data-copy-msg="1">${IC.copy}<span>Salin</span></button></div>
    </div>`;
  const body = el.querySelector(".body");
  const cont = el.querySelector(".content");
  body.dataset.raw = text;
  if(role === "user"){
    cont.textContent = text;
    cont.style.whiteSpace = "pre-wrap";
  }else{
    cont.innerHTML = md(text);
    bindCopies(body);
  }
  wrap.appendChild(el);
  scrollDown(true);
  return el;
}

/* ---- indikator proses bertahap ---- */
const STAGES = ["Menganalisis permintaan","Menyusun langkah","Menjalankan perintah","Merapikan jawaban"];
let typingTimer = null, typingT0 = 0;
function addTyping(){
  hideWelcome();
  delTyping();
  const el = document.createElement("div");
  el.className = "msg assistant typing-msg anim";
  el.id = "typing";
  el.innerHTML = `<div class="who"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.1L19 10l-4.8 1.9L12 17l-2.2-5.1L5 10l4.8-1.9z"/></svg></div>
    <div class="body"><div class="thinking">
      <div class="tdots"><i></i><i></i><i></i></div>
      <div class="tstage" id="tstage">${STAGES[0]}</div>
      <div class="tsec hide-sm" id="tsec">0s</div>
    </div></div>`;
  wrap.appendChild(el);
  scrollDown(true);
  typingT0 = Date.now();
  typingTimer = setInterval(()=>{
    const d = Date.now() - typingT0;
    const s = $("#tsec"); if(s) s.textContent = Math.round(d/1000) + "s";
    const st = $("#tstage"); if(st) st.textContent = STAGES[Math.min(STAGES.length-1, Math.floor(d/4500))];
  }, 1000);
  syncStatus();
  return el;
}
function delTyping(){
  if(typingTimer){ clearInterval(typingTimer); typingTimer = null; }
  const t=$("#typing"); if(t) t.remove();
  syncStatus();
}

/* ---- animasi "menulis" untuk jawaban final ---- */
function revealAnswer(el, text){
  return new Promise(resolve=>{
    const body = el.querySelector(".body");
    const cont = el.querySelector(".content");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!text){ cont.innerHTML = md("(kosong)"); resolve(); return; }
    if(reduce || text.length > 9000){
      cont.innerHTML = md(text); bindCopies(body); resolve(); return;
    }
    const dur = Math.min(1400, Math.max(420, text.length * 3.2));
    const t0 = performance.now();
    el.classList.add("typing-out");
    let frame = 0;
    const step = (now)=>{
      frame++;
      const p = Math.min(1, (now - t0) / dur);
      const n = Math.max(1, Math.floor(text.length * p));
      cont.textContent = text.slice(0, n);
      if(frame % 4 === 0) scrollDown();
      if(p < 1){ requestAnimationFrame(step); }
      else{
        el.classList.remove("typing-out");
        cont.innerHTML = md(text);
        bindCopies(body);
        scrollDown(true);
        resolve();
      }
    };
    requestAnimationFrame(step);
  });
}

function renderWelcome(title, sub){
  wrap.innerHTML = "";
  const d = document.createElement("div");
  d.className = "welcome"; d.id = "welcome";
  d.innerHTML = `<div class="wmark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.1L19 10l-4.8 1.9L12 17l-2.2-5.1L5 10l4.8-1.9z"/></svg></div>
    <h2></h2><p></p>
    <div class="cards">
      <button class="chip">${IC.chat}<span>Jelaskan apa itu PURU-AI</span></button>
      <button class="chip">${IC.code}<span>Buatkan fungsi Python cek bilangan prima</span></button>
      <button class="chip">${IC.file}<span>Unduh video lalu kirim ke chat ini</span></button>
      <button class="chip">${IC.spark}<span>Ringkas memori jangka panjangku</span></button>
    </div>`;
  d.querySelector("h2").textContent = title;
  d.querySelector("p").textContent = sub;
  wrap.appendChild(d);
  bindChips();
}
function bindChips(){
  wrap.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click", ()=> sendMsg(c.textContent));
  });
}
function renderAll(msgs){
  wrap.innerHTML = "";
  if(!msgs || !msgs.length){
    renderWelcome("Selamat datang di Puru AI",
      "Asisten pribadi buat ngobrol, cari informasi, menjalankan perintah, dan mengirim file langsung ke sini.");
    return;
  }
  msgs.forEach((m, i)=>{
    const el = addMsg(m.role, m.content, i === msgs.length - 1);
    if(m.files && m.files.length) addFiles(el, m.files);
  });
}

/* ---------------- api ---------------- */
async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts));
  const j = await r.json().catch(()=>({error:"respons tidak valid"}));
  if(!r.ok){ const e = new Error(j.message||j.error||("HTTP "+r.status)); e.status=r.status; throw e; }
  return j;
}

async function loadHistory(){
  const j = await api("/api/messages"+(chatId?("?chat_id="+chatId):""));
  setChatId(j.chat_id);
  renderAll(j.messages || []);
}

async function refreshInfo(){
  try{
    const j = await api("/api/info"+(chatId?("?chat_id="+chatId):""));
    setChatId(j.chat_id);
    freshMode = !!j.fresh;
    renderFresh();
    const st = $("#st-text");
    if(st) st.textContent = j.running ? "memproses…" : "online";
    sbFoot.classList.toggle("off", false);
    if(!j.running){ syncStatus(); }
    return j;
  }catch(e){
    const st = $("#st-text");
    if(st) st.textContent = "offline";
    sbFoot.classList.add("off");
    return null;
  }
}

async function loadChats(){
  chatList.innerHTML = '<div class="sb-skel"></div><div class="sb-skel"></div><div class="sb-skel"></div>';
  let list = [];
  try{
    const j = await api("/api/chats");
    list = (j.chats || []).slice().sort((a,b)=>{
      if(a.id === chatId) return -1;
      if(b.id === chatId) return 1;
      return (b.updated||"").localeCompare(a.updated||"") || (b.id - a.id);
    });
  }catch(e){}
  chatList.innerHTML = "";
  if(!list.length){ chatList.innerHTML = '<div class="sb-empty">Belum ada riwayat. Mulai percakapan baru buat nongol di sini.</div>'; return; }
  list.forEach(c=>{
    const b = document.createElement("button");
    b.className = "sb-item" + (Number(c.id) === chatId ? " active" : "");
    const t = document.createElement("span");
    t.className = "sb-t";
    t.textContent = c.title || "(tanpa judul)";
    const m = document.createElement("span");
    m.className = "sb-m";
    m.textContent = (c.updated || "") + (c.messages ? " · " + c.messages + " pesan" : "");
    b.appendChild(t); b.appendChild(m);
    b.addEventListener("click", ()=> openChat(Number(c.id)));
    chatList.appendChild(b);
  });
}

/* nungguin balasan AI yang masih diproses server (reload pas AI mikir) */
async function pollPending(){
  if(polling) return;
  polling = true;
  busy = true; send.disabled = true;
  const myGen = gen;
  addTyping();
  let lastLen = wrap.querySelectorAll(".msg:not(#typing)").length;
  for(let i=0;i<3600;i++){
    await sleep(3000);
    if(myGen !== gen){ polling = false; syncStatus(); return; }
    try{
      const j = await api("/api/messages"+(chatId?("?chat_id="+chatId):""));
      if(myGen !== gen){ polling = false; syncStatus(); return; }
      const msgs = j.messages || [];
      const inf = await api("/api/info"+(chatId?("?chat_id="+chatId):""));
      if(myGen !== gen){ polling = false; syncStatus(); return; }
      if(!inf.running){
        delTyping();
        renderAll(msgs);
        polling = false; busy = false; send.disabled = false;
        refreshInfo(); loadChats();
        return;
      }
      if(msgs.length !== lastLen){
        lastLen = msgs.length;
        delTyping();
        renderAll(msgs);
        addTyping();
      }
    }catch(e){}
  }
  delTyping();
  polling = false; busy = false; send.disabled = false;
}

/* ---------------- aksi ---------------- */
async function openChat(id){
  id = Number(id);
  if(id === chatId){ closeSidebar(); return; }
  gen++; polling = false; busy = false; send.disabled = false; syncStatus();
  setChatId(id);
  wrap.innerHTML = "";
  try{ await loadHistory(); }catch(e){ renderWelcome("Gagal memuat", e.message); }
  closeSidebar();
  const info = await refreshInfo();
  if(info && info.running) pollPending();
  loadChats();
  input.focus();
}

async function newChat(){
  try{
    const j = await api("/api/new_chat", {method:"POST", body:"{}"});
    gen++; polling = false; busy = false; send.disabled = false; syncStatus();
    setChatId(j.chat_id);
    freshMode = true; renderFresh();
    renderWelcome("Chat baru — mode fresh",
      "Percakapan mulai dari nol (tanpa memori jangka panjang). Riwayat lama tetap tersimpan di sidebar.");
    closeSidebar();
    refreshInfo(); loadChats(); input.focus();
  }catch(e){ alert("Gagal: " + e.message); }
}

async function clearChat(){
  if(!confirm("Hapus riwayat chat ini?")) return;
  try{
    await api("/api/clear", {method:"POST", body:JSON.stringify({chat_id:chatId})});
    gen++; polling = false; busy = false; send.disabled = false; syncStatus();
    freshMode = true; renderFresh();
    renderWelcome("Riwayat dihapus",
      "Percakapan ini dibersihin dan mode fresh aktif. Mulai lagi kapan saja.");
    refreshInfo(); loadChats();
  }catch(e){
    if(e.status === 409) alert("Chat ini masih diproses, coba lagi nanti.");
    else alert("Gagal: " + e.message);
  }
}

async function sendMsg(text){
  text = (text || "").trim();
  if((!text && !attachments.length) || busy) return;
  const payload = withAttachments(text);
  busy = true; send.disabled = true;
  const myGen = ++gen;
  addMsg("user", payload, true);
  input.value = ""; autosize();
  addTyping();
  syncStatus();
  try{
    const j = await api("/api/chat", {method:"POST", body:JSON.stringify({message:payload, chat_id:chatId})});
    if(myGen !== gen) return;
    delTyping();
    setChatId(j.chat_id);
    const el = addMsg("assistant", "", true);
    await revealAnswer(el, j.reply || "(kosong)");
    if(myGen !== gen) return;
    addFiles(el, j.files);
    attachments = []; renderAttach();
    refreshInfo(); loadChats();
  }catch(e){
    if(myGen !== gen) return;
    delTyping();
    const el = addMsg("assistant", "", true);
    await revealAnswer(el, e.status === 409
      ? "Permintaan sebelumnya masih diproses. Tunggu sebentar, lalu kirim ulang."
      : "Terjadi kesalahan: " + e.message);
  }finally{
    if(myGen === gen){ busy = false; send.disabled = false; syncStatus(); input.focus(); }
  }
}

/* ---------------- file: kirim ke Puru & ambil dari Puru ---------------- */
let attachments = [];
const attachBar = $("#attachbar"), filePick = $("#filepick");

function fmtSize(n){
  n = Number(n || 0);
  if(n < 1024) return n + " B";
  if(n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}
function renderAttach(){
  if(!attachBar) return;
  attachBar.innerHTML = "";
  attachBar.classList.toggle("on", attachments.length > 0);
  attachments.forEach((a,i)=>{
    const d = document.createElement("div");
    d.className = "attach-chip";
    d.innerHTML = fileIcon(a.name) + '<span class="nm"></span><span class="sz"></span><button class="rm" title="Hapus lampiran"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    d.querySelector(".nm").textContent = a.name;
    d.querySelector(".sz").textContent = fmtSize(a.size);
    d.querySelector(".rm").addEventListener("click", ()=>{ attachments.splice(i,1); renderAttach(); });
    attachBar.appendChild(d);
  });
}
function withAttachments(t){
  if(!attachments.length) return t;
  const head = attachments.map(a=>"[Lampiran: " + a.path + "]").join("\n");
  return t ? head + "\n" + t : head;
}
var IMG_EXT = ["png","jpg","jpeg","gif","webp","bmp","avif","svg"];
var VID_EXT = ["mp4","webm","mov","m4v","ogv","mkv"];
var AUD_EXT = ["mp3","m4a","m4b","aac","ogg","oga","opus","flac","wav","weba","wma","amr"];
function extOf(name){ var m = /\.([a-z0-9]+)$/i.exec(name || ""); return m ? m[1].toLowerCase() : ""; }
function isImage(name){ return IMG_EXT.indexOf(extOf(name)) >= 0; }
function isVideo(name){ return VID_EXT.indexOf(extOf(name)) >= 0; }
function isAudio(name){ return AUD_EXT.indexOf(extOf(name)) >= 0; }
function inlineUrl(u){ u = u || ""; return u + (u.indexOf("?") >= 0 ? "&" : "?") + "inline=1"; }
function mediaEl(f){
  if(isImage(f.name)){
    const img = document.createElement("img");
    img.className = "fmedia"; img.src = inlineUrl(f.url); img.loading = "lazy";
    img.alt = f.name || "gambar"; img.title = "Klik untuk buka ukuran penuh";
    img.addEventListener("click", ()=>{ window.open(inlineUrl(f.url), "_blank"); });
    return img;
  }
  if(isVideo(f.name)){
    const v = document.createElement("video");
    v.className = "fmedia"; v.src = inlineUrl(f.url); v.controls = true;
    v.preload = "metadata"; v.playsInline = true;
    v.title = f.name || "video";
    v.addEventListener("error", ()=>{
      const w = document.createElement("div");
      w.className = "fmedia-err";
      w.textContent = "Video ini formatnya nggak bisa diputar di browser (mis. H.265). Pakai tombol unduh di bawah, atau buka di aplikasi pemutar video.";
      v.replaceWith(w);
    }, {once:true});
    return v;
  }
  if(isAudio(f.name)){
    const au = document.createElement("audio");
    au.className = "fmedia fmedia-audio"; au.src = inlineUrl(f.url);
    au.controls = true; au.preload = "metadata";
    au.title = f.name || "audio";
    au.addEventListener("error", ()=>{
      const w = document.createElement("div");
      w.className = "fmedia-err";
      w.textContent = "Audio ini nggak bisa diputar langsung di browser. Pakai tombol unduh di bawah, atau buka pakai aplikasi pemutar musik.";
      au.replaceWith(w);
    }, {once:true});
    return au;
  }
  return null;
}
function addFiles(el, files){
  if(!el || !files || !files.length) return;
  const body = el.querySelector(".body");
  if(!body) return;
  let box = body.querySelector(".msg-files");
  if(!box){ box = document.createElement("div"); box.className = "msg-files"; body.appendChild(box); }
  files.forEach((f,i)=>{
    const prev = mediaEl(f);
    if(prev) box.appendChild(prev);
    const a = document.createElement("a");
    a.className = "fchip";
    a.style.animationDelay = (i*45) + "ms";
    a.href = f.url; a.setAttribute("download", f.name || "");
    a.innerHTML = '<span class="fi"></span><span class="nm"></span><span class="sz"></span>' + IC.download;
    a.querySelector(".fi").innerHTML = fileIcon(f.name || "");
    a.querySelector(".nm").textContent = f.name || "file";
    a.querySelector(".sz").textContent = fmtSize(f.size);
    a.title = f.caption ? (f.name + " — " + f.caption) : f.name;
    box.appendChild(a);
  });
  scrollDown(true);
}
if($("#btn-attach")) $("#btn-attach").addEventListener("click", ()=> filePick.click());
if(filePick) filePick.addEventListener("change", async ()=>{
  const picked = Array.from(filePick.files || []);
  for(const f of picked){
    const fd = new FormData();
    fd.append("file", f, f.name);
    try{
      const r = await fetch("/api/upload", {method:"POST", body:fd});
      const j = await r.json().catch(()=>({error:"respons tidak valid"}));
      if(!r.ok) throw new Error(j.message || j.error || ("HTTP " + r.status));
      attachments.push({name: j.name || f.name, path: j.path, size: j.size});
    }catch(e){ alert("Gagal unggah " + f.name + ": " + e.message); }
  }
  filePick.value = "";
  renderAttach();
});
async function openFiles(){
  const panel = $("#filesPanel"), body = $("#fp-body");
  if(!panel || !body) return;
  panel.classList.add("show");
  body.innerHTML = '<div class="fp-empty">Memuat…</div>';
  try{
    const j = await api("/api/files" + (chatId ? ("?chat_id=" + chatId) : ""));
    const items = j.files || [];
    if(!items.length){
      body.innerHTML = '<div class="fp-empty">Belum ada file. Lampirkan file pakai tombol klip, atau minta Puru bikin/unduh file — hasilnya muncul di sini dan bisa langsung diunduh.</div>';
      return;
    }
    body.innerHTML = "";
    items.forEach((f,i)=>{
      const row = document.createElement("div");
      row.className = "fp-row";
      row.style.animation = "enter .3s var(--ease) both";
      row.style.animationDelay = Math.min(i*35, 400) + "ms";
      row.innerHTML = '<span class="ic"></span><span class="meta"><span class="n"></span><span class="d"></span></span><span class="acts"><a class="play" target="_blank" rel="noopener"></a><a class="dl" title="Unduh"></a></span>';
      row.querySelector(".n").textContent = f.name || "file";
      row.querySelector(".d").textContent = [fmtSize(f.size), f.time, f.src].filter(Boolean).join(" · ");
      const ic = row.querySelector(".ic");
      if(isImage(f.name)){
        const im = document.createElement("img");
        im.className = "fp-thumb"; im.src = inlineUrl(f.url); im.loading = "lazy"; im.alt = f.name || "";
        ic.replaceWith(im);
      } else {
        ic.innerHTML = fileIcon(f.name);
      }
      const pl = row.querySelector(".play"), dl = row.querySelector(".dl");
      if(isImage(f.name) || isVideo(f.name) || isAudio(f.name)){
        pl.href = inlineUrl(f.url);
        pl.innerHTML = (isVideo(f.name) || isAudio(f.name))
          ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg><span>Putar</span>'
          : '<span>Buka</span>';
      } else { pl.remove(); }
      dl.href = f.url; dl.setAttribute("download", "");
      dl.innerHTML = IC.download + "<span>Unduh</span>";
      body.appendChild(row);
    });
  }catch(e){
    body.innerHTML = '<div class="fp-empty">Gagal memuat daftar file.</div>';
  }
}
if($("#btn-files")) $("#btn-files").addEventListener("click", openFiles);
if($("#fp-close")) $("#fp-close").addEventListener("click", ()=> $("#filesPanel").classList.remove("show"));
if($("#filesPanel")) $("#filesPanel").addEventListener("click", e=>{ if(e.target.id === "filesPanel") $("#filesPanel").classList.remove("show"); });

/* ---------------- composer ---------------- */
function autosize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, Math.round(window.innerHeight * 0.45)) + "px";
}
input.addEventListener("input", autosize);
send.addEventListener("click", ()=> sendMsg(input.value));

/* ---------------- tombol ---------------- */
$("#btn-fresh").addEventListener("click", toggleFresh);
$("#btn-new").addEventListener("click", newChat);
$("#btn-new-sb").addEventListener("click", newChat);
$("#btn-clear").addEventListener("click", clearChat);
$("#btn-menu").addEventListener("click", openSidebar);
backdrop.addEventListener("click", closeSidebar);
document.addEventListener("keydown", e=>{ if(e.key === "Escape"){ closeSidebar(); $("#filesPanel").classList.remove("show"); } });

/* ---------------- boot ---------------- */
(async function(){
  try{
    const saved = parseInt(localStorage.getItem("puru_chat_id")||"0", 10);
    if(saved > 0) chatId = saved;
  }catch(e){}
  renderFresh();
  syncStatus();
  try{ await loadHistory(); }
  catch(e){ renderWelcome("Selamat datang di Puru AI", "Tanya apa saja — jawaban teks dan kode dibedakan otomatis."); }
  await loadChats();
  const info = await refreshInfo();
  if(info && info.running) pollPending();
  setInterval(()=>{ refreshInfo(); }, 15000);
  input.focus();
})();
</script>
